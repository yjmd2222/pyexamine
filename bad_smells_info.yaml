code_smells:
  Long Method:
    smell_type: code
    LONG_METHOD_LINES:
      value: 45
      explanation: "Methods longer than this many lines may be too complex and should be refactored."

  Large Class:
    smell_type: code
    LARGE_CLASS_METHODS:
      value: 15
      explanation: "Classes with more than this many methods may have too many responsibilities."

  Primitive Obsession:
    smell_type: code
    PRIMITIVE_OBSESSION_COUNT:
      value: 4
      explanation: "Functions with more than this many primitive parameters may benefit from introducing parameter objects."
    PRIMITIVE_MIN_ARGS:
      value: 3
      explanation: "Minimum number of arguments required before primitive-obsession detection runs."
    PRIMITIVE_RATIO_THRESHOLD:
      value: 0.7
      explanation: "Minimum fraction of primitive-typed parameters to flag primitive obsession."

  Long Parameter List:
    smell_type: code
    LONG_PARAMETER_LIST:
      value: 5
      explanation: "Functions with more than this many parameters may be trying to do too much."

  Data Clumps:
    smell_type: code
    DATA_CLUMPS_THRESHOLD:
      value: 6
      explanation: "Groups of parameters appearing together in multiple functions may indicate data clumps."
    DATA_CLUMP_MIN_COMBO_SIZE:
      value: 3
      explanation: "Minimum parameter-group size to consider for data clumps."

  Switch Statements:
    smell_type: code
    COMPLEX_CONDITIONAL:
      value: 3
      explanation: "If-else chains longer than this may indicate a switch statement smell."

  Temporary Field:
    smell_type: code
    TEMPORARY_FIELD_THRESHOLD:
      value: 3
      explanation: "Fields initialized but not used in most methods may be temporary fields."

  Alternative Classes with Different Interfaces:
    smell_type: code
    ALTERNATIVE_CLASSES_THRESHOLD:
      value: 3
      explanation: "Classes with identical sets of methods may be alternative classes with different interfaces."

  Potential Divergent Change:
    smell_type: code
    DIVERGENT_CHANGE_PREFIXES:
      value: 4
      explanation: "Classes with more than this many distinct method name prefixes may be changing for too many reasons."
    DIVERGENT_CHANGE_METHODS:
      value: 5
      explanation: "Classes with more than this many methods changing for different reasons may have divergent change."

  Parallel Inheritance Hierarchies:
    smell_type: code
    PARALLEL_INHERITANCE_SIMILARITY_THRESHOLD:
      value: 0.3
      explanation: "Minimum similarity between method sets to mark parallel inheritance hierarchies."

  Potential Shotgun Surgery:
    smell_type: code
    SHOTGUN_SURGERY_CALLS:
      value: 5
      explanation: "Methods called in more than this many places may cause shotgun surgery when changed."
    SHOTGUN_SURGERY_CONTEXTS:
      value: 3
      explanation: "Methods called in more than this many different contexts may cause shotgun surgery."
    SHOTGUN_SURGERY_EXCLUDE_NAMES:
      value: ['log', 'print', 'str', 'len', 'isinstance', 'super']
      explanation: "Names to ignore when collecting calls for shotgun surgery detection."

  Excessive Comments:
    smell_type: code
    EXCESSIVE_COMMENTS_RATIO:
      value: 0.3
      explanation: "Files with more than this ratio of comment lines to total lines may be over-commented."
    LARGE_COMMENT_BLOCKS:
      value: 5
      explanation: "Comment blocks larger than this may indicate code that needs refactoring."

  Duplicate Code:
    smell_type: code
    DUPLICATE_CODE_THRESHOLD:
      value: 15
      explanation: "Functions with identical code may indicate duplication that should be refactored."
    DUPLICATE_CODE_MIN_LINES:
      value: 5
      explanation: "Minimum number of lines to consider for duplicate code detection."

  Data Class:
    smell_type: code
    DATA_CLASS_METHODS:
      value: 4
      explanation: "Treat classes with at least this many trivial getter/setter methods and no other behavior as data classes."

  Dead Code:
    smell_type: code
    DEAD_CODE_THRESHOLD:
      value: 3
      explanation: "Functions defined but never called may be dead code."

  Lazy Class:
    smell_type: code
    LAZY_CLASS_METHODS:
      value: 4
      explanation: "Classes with this few methods or fewer may not be pulling their weight."
    LAZY_CLASS_LINES:
      value: 50
      explanation: "Flag lazy classes whose non-trivial methods span no more than this many total lines."

  Speculative Generality:
    smell_type: code
    SPECULATIVE_GENERALITY_THRESHOLD:
      value: 4
      explanation: "Abstract classes with no concrete implementations may indicate speculative generality."
    UNUSED_PARAMETERS_THRESHOLD:
      value: 6
      explanation: "An accumulation of unused method parameters suggests an interface is more complex than its current implementation requires, a common sign of over-engineering."

  Feature Envy:
    smell_type: code
    FEATURE_ENVY_CALLS:
      value: 3
      explanation: "Methods that call another object's methods/properties more than this many times may belong to that other object."
    FEATURE_ENVY_LOCAL_RATIO:
      value: 2.0
      explanation: "Multiplier comparing external calls to local calls to help detect feature envy."

  Inappropriate Intimacy:
    smell_type: code
    INAPPROPRIATE_INTIMACY_SHARED:
      value: 3
      explanation: "Classes that share more than this many fields/methods may be too intimate."
    INAPPROPRIATE_INTIMACY_METHOD_RATIO:
      value: 0.3
      explanation: "Minimum fraction of shared methods/fields used to flag inappropriate intimacy."

  Message Chains:
    smell_type: code
    MESSAGE_CHAIN_LENGTH:
      value: 3
      explanation: "Method call chains longer than this may indicate tight coupling and violate the Law of Demeter."

  Middle Man:
    smell_type: code
    MIDDLE_MAN_RATIO:
      value: 0.5
      explanation: "Classes where more than this ratio of methods simply delegate to another class may be middle men."
    MIDDLE_MAN_MAX_DELEGATE_TARGETS:
      value: 2
      explanation: "Maximum number of delegate targets allowed before a delegating class is no longer considered a middle-man smell."

architectural_smells:
  Hub-like Dependency:
    smell_type: architectural
    HUB_LIKE_DEPENDENCY_THRESHOLD:
      value: 0.5
      explanation: "Modules connected to more than this threshold of total modules may be hub-like dependencies."
    MIN_HUB_CONNECTIONS:
      value: 5
      explanation: "Require at least this many total connections before flagging a hub-like dependency."
    HUB_MIN_PROJECT_MODULES:
      value: 3
      explanation: "Minimum number of modules required before hub-like dependency detection runs."
    HUB_BALANCE_RATIO_MIN:
      value: 0.2
      explanation: "Lower bound for fan_in/fan_out balance ratio when evaluating hub-like modules."
    HUB_BALANCE_RATIO_MAX:
      value: 5
      explanation: "Upper bound for fan_in/fan_out balance ratio when evaluating hub-like modules."

  Scattered Functionality:
    smell_type: architectural
    SCATTERED_MIN_FUNCTION_NAME_LENGTH:
      value: 3
      explanation: "Minimum function name length to consider when detecting scattered functionality."
    SCATTERED_EXCLUDED_NAMES:
      value: ['main', 'init', 'setup', 'test']
      explanation: "Function names to exclude when detecting scattered functionality."
    MIN_SCATTERED_OCCURRENCES:
      value: 3
      explanation: "Minimum number of distinct modules sharing the same function name to treat functionality as scattered."

  Potential Redundant Abstractions:
    smell_type: architectural
    REDUNDANT_MIN_FUNCTIONS:
      value: 3
      explanation: "Minimum number of functions a module must have before checking for redundant abstractions."
    REDUNDANT_SIMILARITY_THRESHOLD:
      value: 0.8
      explanation: "Minimum Jaccard similarity between module function sets to mark redundant abstractions."

  God Object:
    smell_type: architectural
    GOD_OBJECT_FUNCTIONS:
      value: 20
      explanation: "Modules with more than this many functions may be trying to do too much and should be split."
    MIN_GOD_OBJECT_FUNCTIONS:
      value: 5
      explanation: "Ignore god-object detection for modules with fewer than this many public functions."

  Potential Improper API Usage:
    smell_type: architectural
    MIN_API_CALLS:
      value: 10
      explanation: "Only evaluate improper API usage when a module makes at least this many API calls."
    API_REPETITION_THRESHOLD:
      value: 0.4
      explanation: "Modules with more than this threshold of repeated API calls to total calls may have improper API usage."
    API_REPETITION_MIN_COUNT:
      value: 3
      explanation: "Minimum repetition count for an API call to be considered in repetition metrics."

  Orphan Module:
    smell_type: architectural
    ORPHAN_EXCLUDED_MODULES:
      value: ['__init__', 'setup', 'tests', 'utils']
      explanation: "Module names/patterns to ignore when detecting orphan modules."
    MIN_PROJECT_SIZE:
      value: 3
      explanation: "Require at least this many modules in the dependency graph before searching for orphan modules."

  Cyclic Dependency:
    smell_type: architectural
    MIN_CYCLE_SIZE:
      value: 2
      explanation: "Ignore dependency cycles smaller than this length."
    MAX_CYCLE_SIZE:
      value: 5
      explanation: "Cyclic dependencies involving more than this many modules are considered problematic."
    CYCLE_HIGH_MIN_SIZE:
      value: 3
      explanation: "Minimum cycle length to consider a cycle 'high' when combined with strength."
    CYCLE_HIGH_MIN_STRENGTH:
      value: 3
      explanation: "Minimum cycle strength to consider a cycle 'high' when combined with size."
    CYCLE_EXCLUDED_MODULES:
      value: ['__init__', 'utils', 'common', 'base', 'core']
      explanation: "Module name patterns to ignore when analyzing dependency cycles."

  Unstable Dependency:
    smell_type: architectural
    UNSTABLE_DEPENDENCY_THRESHOLD:
      value: 0.8
      explanation: "Modules with instability higher than this value may be too dependent on other modules and prone to changes."
    MIN_DEPENDENCIES:
      value: 5
      explanation: "Only analyze instability for modules with at least this many total dependencies."

structural_smells:
  High Number of Methods (NOM):
    smell_type: structural
    NOM_THRESHOLD:
      value: 10
      explanation: "Classes with more than this many methods may be too complex."

  High Weighted Methods per Class (WMPC):
    smell_type: structural
    WMPC1_THRESHOLD:
      value: 20
      explanation: "Classes with Weighted Methods per Class (complexity-based) higher than this may be too complex."
    WMPC2_THRESHOLD:
      value: 20
      explanation: "Classes with Weighted Methods per Class (parameter-based) higher than this may have too many responsibilities."

  Large Class (SIZE2):
    smell_type: structural
    SIZE2_THRESHOLD:
      value: 15
      explanation: "Classes with more than this many members (methods + fields) may be too large."

  High Weight of a Class (WAC):
    smell_type: structural
    WAC_THRESHOLD:
      value: 10
      explanation: "Classes with more than this many fields may have poor encapsulation."

  High Lack of Cohesion of Methods (LCOM):
    smell_type: structural
    LCOM_THRESHOLD:
      value: 10
      explanation: "Classes with Lack of Cohesion in Methods higher than this may need to be split."

  High Response for a Class (RFC):
    smell_type: structural
    RFC_THRESHOLD:
      value: 20
      explanation: "Classes with Response for Class higher than this may be too coupled."

  High Number of Classes per Module (NOCC):
    smell_type: structural
    NOCC_THRESHOLD:
      value: 10
      explanation: "Modules with more than this many classes may be too complex."
    NOCC_AVG_WEIGHT_BOUND_LOW:
      value: 5
      explanation: "Lower bound for average class weight used to adjust NOCC threshold."
    NOCC_AVG_WEIGHT_BOUND_HIGH:
      value: 15
      explanation: "Upper bound for average class weight used to adjust NOCC threshold."
    NOCC_MULTIPLIER_LOW:
      value: 1.5
      explanation: "Multiplier applied to NOCC threshold when avg weight is low."
    NOCC_MULTIPLIER_HIGH:
      value: 0.7
      explanation: "Multiplier applied to NOCC threshold when avg weight is high."

  Deep Inheritance Tree (DIT):
    smell_type: structural
    DIT_THRESHOLD:
      value: 3
      explanation: "Classes with Depth of Inheritance Tree higher than this may be using inheritance excessively."
    FRAMEWORK_BASES:
      value: ['object', 'Exception', 'dict', 'list', 'set', 'tuple', 'str', 'int', 'float']
      explanation: "Base classes treated as framework/kernel classes to be excluded from DIT calculations."

  High Lines of Code (LOC):
    smell_type: structural
    LOC_THRESHOLD:
      value: 150
      explanation: "Modules with more than this many lines of code may be too large."
    LOC_TEST_FILE_MULTIPLIER:
      value: 1.5
      explanation: "Multiplier to allow longer LOC for test modules."
    LOC_DOC_COMPLEXITY_RATIO_BREAKPOINT:
      value: 0.5
      explanation: "If documentation ratio is below this, allow extra LOC via multiplier."
    LOC_DOC_COMPLEXITY_MULTIPLIER:
      value: 1.3
      explanation: "Multiplier applied to LOC threshold when a module has a low code/documentation complexity ratio."

  High Message Passing Coupling (MPC):
    smell_type: structural
    MPC_THRESHOLD:
      value: 25
      explanation: "Classes with Message Passing Coupling higher than this may be too coupled."
    MPC_EXTERNAL_WEIGHT:
      value: 1.5
      explanation: "Weight applied to external calls when computing weighted MPC."

  High Coupling Between Object Classes (CBO):
    smell_type: structural
    CBO_THRESHOLD:
      value: 5
      explanation: "Modules with Coupling Between Object Classes higher than this may be too coupled."
    CBO_DIRECT_WEIGHT:
      value: 1.5
      explanation: "Weight applied to direct coupling when computing weighted CBO."
    CBO_INDIRECT_WEIGHT:
      value: 0.5
      explanation: "Weight applied to indirect coupling when computing weighted CBO."

  High Number of Children (NOC):
    smell_type: structural
    NOC_THRESHOLD:
      value: 7
      explanation: "Projects with more than this many classes may be too large or complex."
    NOC_LOC_BREAKPOINT_HIGH:
      value: 10000
      explanation: "LOC breakpoint to treat a project as large for NOC threshold adjustment."
    NOC_LOC_BREAKPOINT_MEDIUM:
      value: 5000
      explanation: "LOC breakpoint for medium-sized projects used in NOC threshold adjustment."
    NOC_LOC_MULTIPLIER_HIGH:
      value: 1.5
      explanation: "Multiplier applied to NOC threshold for very large projects."
    NOC_LOC_MULTIPLIER_MEDIUM:
      value: 1.2
      explanation: "Multiplier applied to NOC threshold for medium projects."

  High Cyclomatic Complexity:
    smell_type: structural
    CYCLOMATIC_COMPLEXITY_THRESHOLD:
      value: 10
      explanation: "Methods with cyclomatic complexity higher than this may be too complex and hard to maintain."

  High Fan-out:
    smell_type: structural
    MAX_FANOUT:
      value: 15
      explanation: "Modules with more outgoing dependencies than this may be too coupled to other modules."

  High Fan-in:
    smell_type: structural
    MAX_FANIN:
      value: 15
      explanation: "Modules with more incoming dependencies than this may be too central or have too many responsibilities."

  Long File:
    smell_type: structural
    MAX_FILE_LENGTH:
      value: 250
      explanation: "Files with more lines than this may be too large and should be split."

  Too Many Branches:
    smell_type: structural
    MAX_BRANCHES:
      value: 10
      explanation: "Methods with more branches (if/else, switch cases) than this may be too complex."
    MAX_NESTING_DEPTH:
      value: 4
      explanation: "Code with nesting depth greater than this may be too complex and hard to read."
    BRANCH_EXCLUDE_METHOD_PREFIXES:
      value: ['get_', 'set_', 'is_']
      explanation: "Method prefixes to exclude from branch-count-based smell detection."
    BRANCH_EXCLUDE_DECORATORS:
      value: ['property']
      explanation: "Decorators whose methods should be excluded from branch checks."
